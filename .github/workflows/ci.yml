name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beliefmap
          POSTGRES_PASSWORD: beliefmap
          POSTGRES_DB: beliefmap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beliefmap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://beliefmap:beliefmap@localhost:5432/beliefmap
      PHONE_PEPPER: ci-only-pepper
      MIN_GROUP_SIZE: "5"
      API_KEYS: ci-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:questions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
